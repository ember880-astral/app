name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The runner image already ships the Android SDK (ANDROID_HOME).
      # The repo has no Gradle wrapper, so pin a Gradle that matches AGP 8.2.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.4"

      - name: Compile + unit tests
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon assembleDebug testDebugUnitTest 2>&1 | tee build.log

      - name: Report compiler / test errors
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |error:|FAILED|What went wrong|Could not|expected:<" build.log | head -60 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
